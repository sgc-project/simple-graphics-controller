[package]
name = "simple-graphics-controller"
version = "0.1.0"
edition = "2024"
license = "Unlicense"
description = "Resource daemon that leases DRM/fbdev display and input devices to clients over the @sgc socket"

[features]
# Backends are compile-time features: a build includes exactly the backends
# it was compiled with. The protocol crate is deliberately ungated — an
# unbuilt backend is simply never advertised, and Acquires against it are
# denied "not registered". See docs/resource-manager.md.
default = ["drm", "input"]
fbdev = []
drm = ["dep:drm"]
input = ["dep:evdev"]

[dependencies]
# Published on crates.io; the path is for this workspace layout (a sibling
# checkout), the version is what a consumer without it resolves. The path
# wins locally, so bump the version here when the protocol changes.
simple-graphics-protocol = { version = "0.1", path = "../simple-graphics-protocol" }
tokio = { version = "1", features = ["full"] }
nix = { version = "0.29", features = ["fs", "socket", "uio", "inotify", "poll"] }
sendfd = { version = "0.4.4", features = ["tokio"] }
dashmap = "6.2.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0.104"
thiserror = "1"
evdev = { version = "0.12", optional = true }
drm = { version = "0.15", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# --- .deb packaging (cargo-deb) -----------------------------------------
# The server package: the daemon + the runtime shared libsgc.so (apps that
# link libsgc dynamically need only this package). The daemon is the
# default-features build (drm + input); a fbdev-only server is a separate
# concern.
[package.metadata.deb]
maintainer = "lulkien <kien.luuhoang.arch@proton.me>"
name = "simple-graphics-controller"
section = "admin"
# NOT Multi-Arch: same — this package ships the daemon (/usr/bin), which
# Debian policy forbids in a multiarch package. Since the repo split the
# daemon package is daemon-only; the client library (headers, libsgc.a,
# runtime libsgc.so) is packaged from the libsgc-c repo.
depends = "$auto"
maintainer-scripts = "debian/"
# The flavors are alternatives, and the conflict has to be declared on *both*
# sides: with it only on the musl package, installing musl removes the glibc one
# (that side resolves), but installing the glibc package over musl fails with a
# file conflict on /usr/bin and the unit - "trying to overwrite ... which is also
# in package simple-graphics-controller-musl". Replaces lets the swap through.
conflicts = "simple-graphics-controller-musl"
replaces = "simple-graphics-controller-musl"
assets = [
    "$auto",
    # systemd unit: started at boot, restarted on failure. Kept in packaging/,
    # not dist/ - dist/ is gitignored build output, so a fresh clone could not
    # build the package. Board builds that run the binary from elsewhere
    # (e.g. /root) override ExecStart with a drop-in - see docs/packaging.md.
    ["packaging/simple-graphics-controller.service", "lib/systemd/system/simple-graphics-controller.service", "644"],
]

# Cross-target flavors cannot run dpkg-shlibdeps against the target's libraries,
# so each states its runtime dependency explicitly. Native builds keep $auto.
# See the package-* recipes in the Justfile.
[package.metadata.deb.variants.gnu-aarch64]
depends = "libc6"

# Fully static musl: no runtime dependencies at all. It carries its own package
# name (and declares itself an alternative to the glibc build) for two reasons:
# cargo-deb derives its output filename from name_version_arch whatever
# --variant says, so two flavors for one architecture would be the same file and
# the later build would replace the earlier one; and the two flavors install onto
# the same paths, which dpkg refuses unless the packages declare the conflict.
#
# One variant, both architectures: it is used by the aarch64 and x86_64 musl
# recipes, which differ only by --target (and therefore by Debian architecture).
[package.metadata.deb.variants.musl]
name = "simple-graphics-controller-musl"
depends = ""
conflicts = "simple-graphics-controller"
replaces = "simple-graphics-controller"
